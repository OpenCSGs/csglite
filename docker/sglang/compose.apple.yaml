# Hybrid deployment, requires a running native macOS SGLang/MLX server.
services:
  csglite:
    image: ${CSGLITE_SGLANG_IMAGE:-csglite-sglang:dev-apple-gateway}
    platform: linux/arm64
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:11435:11435"
    volumes:
      - ${CSGLITE_DATA_DIR:-./data}:/root/.csghub-lite
    environment:
      SGLANG_BASE_URL: http://host.docker.internal:30000/v1
      SGLANG_MODEL_NAME: ${MODEL_NAME:-local-sglang}
      SGLANG_API_KEY: ${SGLANG_API_KEY:-}
