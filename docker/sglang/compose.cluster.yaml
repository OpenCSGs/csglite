# Merge with one platform Compose file. Docker bridge networks use static seeds.
services:
  csglite:
    ports:
      - "11438:11438"
    environment:
      CSGHUB_LITE_CLUSTER_SECRET: ${CSGHUB_LITE_CLUSTER_SECRET:-}
      CSGHUB_LITE_CLUSTER_NAME: ${CSGHUB_LITE_CLUSTER_NAME:-CSGLite Cluster}
      CSGHUB_LITE_CLUSTER_JOIN_TOKEN: ${CSGHUB_LITE_CLUSTER_JOIN_TOKEN:-}
      CSGHUB_LITE_CLUSTER_ADDR: :11438
      CSGHUB_LITE_CLUSTER_SEEDS: ${CSGHUB_LITE_CLUSTER_SEEDS:-}
      CSGHUB_LITE_CLUSTER_DISCOVERY: ${CSGHUB_LITE_CLUSTER_DISCOVERY:-none}
      CSGHUB_LITE_CLUSTER_ADVERTISE_HOST: ${CSGHUB_LITE_CLUSTER_ADVERTISE_HOST:?Set the LAN IP or hostname reachable by other nodes}
      CSGHUB_LITE_CLUSTER_DISABLED: ${CSGHUB_LITE_CLUSTER_DISABLED:-0}
