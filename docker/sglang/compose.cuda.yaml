services:
  csglite:
    image: ${CSGLITE_SGLANG_IMAGE:-csglite-sglang:dev-cu129}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:11435:11435"
    volumes:
      - ${CSGLITE_DATA_DIR:-./data}:/root/.csghub-lite
      - ${MODEL_DIR:?Set MODEL_DIR to a complete local HF model directory}:/root/.csghub-lite/models/serving:ro
    environment:
      CSGHUB_LITE_VERSION: ${CSGHUB_LITE_VERSION:-latest}
      CSGHUB_LITE_REGION: ${CSGHUB_LITE_REGION:-CN}
      SGLANG_MODEL_NAME: ${MODEL_NAME:-local-sglang}
      SGLANG_START_TIMEOUT: "1800"
      SGLANG_EXTRA_ARGS: '${SGLANG_EXTRA_ARGS:-["--mem-fraction-static","0.8","--context-length","8192"]}'
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
