services:
  csglite:
    # Require an explicit tested image: MI30x/MI35x images do not cover MI210.
    image: ${CSGLITE_SGLANG_IMAGE:?Set a CSGLite image built on a GPU-compatible ROCm base}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:11435:11435"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:?Set RENDER_GID to the host render group ID}"
    shm_size: 8gb
    volumes:
      - ${CSGLITE_DATA_DIR:-./data}:/root/.csghub-lite
      - ${MODEL_DIR:?Set MODEL_DIR to a complete local HF model directory}:/root/.csghub-lite/models/serving:ro
    environment:
      HIP_VISIBLE_DEVICES: ${GPU_ID:-0}
      SGLANG_USE_AITER: "0"
      SGLANG_MODEL_NAME: ${MODEL_NAME:-local-sglang}
      SGLANG_START_TIMEOUT: "1800"
      SGLANG_EXTRA_ARGS: '${SGLANG_EXTRA_ARGS:-["--attention-backend","triton","--disable-cuda-graph","--mem-fraction-static","0.8","--context-length","8192"]}'
