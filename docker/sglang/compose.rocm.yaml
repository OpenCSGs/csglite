services:
  csglite:
    # Require an explicit tested image: MI30x/MI35x images do not cover MI210.
    image: ${CSGLITE_SGLANG_IMAGE:?Set a CSGLite image built on a GPU-compatible ROCm base}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:11435:11435"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:?Set RENDER_GID to the host render group ID}"
    shm_size: 8gb
    volumes:
      - ${CSGLITE_DATA_DIR:-./data}:/root/.csghub-lite
      # Optional in native mode: models can be downloaded or pulled through
      # the CSGLite UI/API after the container starts.
      - ${MODEL_DIR:-./models}:/root/.csghub-lite/models/serving:ro
    environment:
      CSGHUB_LITE_VERSION: ${CSGHUB_LITE_VERSION:-latest}
      CSGHUB_LITE_REGION: ${CSGHUB_LITE_REGION:-CN}
      HIP_VISIBLE_DEVICES: ${GPU_ID:-0}
      SGLANG_USE_AITER: "0"
      SGLANG_START_TIMEOUT: "1800"
      # Advanced SGLang flags only. CSGLite chooses bounded context, KV and
      # memory defaults from the model and visible GPUs.
      SGLANG_EXTRA_ARGS: '${SGLANG_EXTRA_ARGS:-["--attention-backend","triton"]}'
