text x="986" y="385" font-size="25" fill="#0f172a" font-weight="650" text-anchor="start">机房服务器</text><text x="986" y="421" font-size="19" fill="#334155" font-weight="400" text-anchor="start">模型在本机执行</text><rect x="954" y="494" width="262" height="109" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><rect x="969" y="515" width="5" height="67" rx="2" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="986" y="534" font-size="25" fill="#0f172a" font-weight="650" text-anchor="start">其他 Lite 设备</text><text x="986" y="570" font-size="19" fill="#334155" font-weight="400" text-anchor="start">模型在本机执行</text><path d="M292 368 H468" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-start="url(#csghub-reverse)" marker-end="url(#csghub-arrow)"/><text x="317" y="337" font-size="19" fill="#7c3aed" font-weight="400" text-anchor="start">平台 API</text><path d="M954 251 H866 V365 H794" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#csghub-arrow)"/><path d="M954 400 H866 V365 H794" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#csghub-arrow)"/><path d="M954 549 H866 V365 H794" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#csghub-arrow)"/><text x="827" y="219" font-size="18" fill="#7c3aed" font-weight="400" text-anchor="start">Lite 主动</text><text x="827" y="242" font-size="18" fill="#7c3aed" font-weight="400" text-anchor="start">连接平台</text><rect x="410" y="520" width="430" height="70" rx="12" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/><text x="430" y="549" font-size="20" fill="#334155" font-weight="600" text-anchor="start">选择共享模型 → 平台审批 → 统一调用</text><text x="430" y="574" font-size="19" fill="#334155" font-weight="400" text-anchor="start">设备无需公网 IP，无需开放入站端口</text>
<text x="48" y="665" font-size="19" fill="#475569" font-weight="400" text-anchor="start">模型权重保留在 Lite 节点，请求和结果经过平台；CSGHub 可部署在公网或私有网络。</text>
