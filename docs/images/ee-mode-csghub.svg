<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-labelledby="csghub-title csghub-desc">
<title id="csghub-title">模式三  CSGHub 算力共享模式</title><desc id="csghub-desc">本地算力接入平台，由 CSGHub 统一提供模型服务。模型权重保留在 Lite 节点，请求和结果经过平台；CSGHub 可部署在公网或私有网络。</desc>
<defs><marker id="csghub-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c3aed" stroke-width="1.5"/></marker><marker id="csghub-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c3aed" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="700" fill="#f8fafc"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<text x="48" y="62" font-size="35" fill="#0f172a" font-weight="700" text-anchor="start">模式三  CSGHub 算力共享模式</text>
<text x="48" y="105" font-size="21" fill="#334155" font-weight="400" text-anchor="start">本地算力接入平台，由 CSGHub 统一提供模型服务</text>
