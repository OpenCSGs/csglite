<text x="1115" y="59" font-size="19" fill="#2563eb" font-weight="650" text-anchor="middle">跨网络主动接入</text>
<rect x="927" y="151" width="307" height="473" rx="18" fill="#fffaf0" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8 6"/><text x="950" y="178" font-size="19" fill="#b45309" font-weight="600" text-anchor="start">跨网络主动接入</text><rect x="52" y="289" width="230" height="125" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><rect x="67" y="310" width="5" height="83" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="84" y="329" font-size="25" fill="#0f172a" font-weight="650" text-anchor="start">业务应用</text><text x="84" y="365" font-size="19" fill="#334155" font-weight="400" text-anchor="start">通过互联网调用</text><rect x="468" y="252" width="312" height="204" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><rect x="483" y="273" width="5" height="162" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="500" y="292" font-size="25" fill="#0f172a" font-weight="650" text-anchor="start">Lite 公网主节点</text><text x="500" y="328" font-size="19" fill="#334155" font-weight="400" text-anchor="start">统一服务入口</text><text x="500" y="359" font-size="19" fill="#334155" font-weight="400" text-anchor="start">接收请求与分配任务</text><text x="500" y="390" font-size="19" fill="#334155" font-weight="400" text-anchor="start">纯网关运行</text><rect x="950" y="195" width="260" height="112" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><rect x="965" y="216" width="5" height="70" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="982" y="235" font-size="25" fill="#0f172a" font-weight="650" text-anchor="start">办公室节点</text><text x="982" y="271" font-size="19" fill="#334155" font-weight="400" text-anchor="start">本地模型与算力</text><rect x="950" y="345" width="260" height="112" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><rect x="965" y="366" width="5" height="70" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="982" y="385" font-size="25" fill="#0f172a" font-weight="650" text-anchor="start">家庭网络节点</text><text x="982" y="421" font-size="19" fill="#334155" font-weight="400" text-anchor="start">本地模型与算力</text><rect x="950" y="495" width="260" height="112" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><rect x="965" y="516" width="5" height="70" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="982" y="535" font-size="25" fill="#0f172a" font-weight="650" text-anchor="start">异地机房节点</text><text x="982" y="571" font-size="19" fill="#334155" font-weight="400" text-anchor="start">本地模型与算力</text><path d="M282 352 H468" fill="none" stroke="#2563eb" stroke-width="2.5" marker-start="url(#public-reverse)" marker-end="url(#public-arrow)"/><text x="310" y="321" font-size="19" fill="#2563eb" font-weight="400" text-anchor="start">统一 API</text><path d="M950 251 H862 V354 H780" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#public-arrow)"/><path d="M950 401 H862 V354 H780" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#public-arrow)"/><path d="M950 551 H862 V354 H780" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#public-arrow)"/><text x="824" y="222" font-size="18" fill="#2563eb" font-weight="400" text-anchor="start">节点主动</text><text x="824" y="245" font-size="18" fill="#2563eb" font-weight="400" text-anchor="start">连接主节点</text><rect x="440" y="501" width="390" height="70" rx="12" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/><text x="460" y="530" font-size="19" fill="#334155" font-weight="600" text-anchor="start">任务与结果在连接中双向传输</text><text x="460" y="554" font-size="18" fill="#334155" font-weight="400" text-anchor="start">无需为每台计算设备设置公网入口</text>
<text x="48" y="665" font-size="19" fill="#475569" font-weight="400" text-anchor="start">计算节点主动连接公网主节点，通过加密隧道执行请求并返回结果。</text>
</g></svg>
