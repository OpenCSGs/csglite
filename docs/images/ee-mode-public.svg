<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-labelledby="public-title public-desc">
<title id="public-title">模式一  公网入口模式</title><desc id="public-desc">一个公网入口，连接分散的 AI 算力。计算节点主动连接公网主节点，通过加密隧道执行请求并返回结果。</desc>
<defs><marker id="public-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker><marker id="public-reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="700" fill="#f8fafc"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<text x="48" y="62" font-size="35" fill="#0f172a" font-weight="700" text-anchor="start">模式一  公网入口模式</text>
<text x="48" y="105" font-size="21" fill="#334155" font-weight="400" text-anchor="start">一个公网入口，连接分散的 AI 算力</text>
